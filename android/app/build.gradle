apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the
 * lines you need.
 */
react {
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 */
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.zoro.mobile"
    defaultConfig {
        applicationId "com.zoro.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
    }
    // No custom signingConfigs block: debug builds are signed with the
    // Android Gradle Plugin's built-in default debug config, which points at
    // ~/.android/debug.keystore and auto-generates that keystore the first
    // time you build if it doesn't exist yet — no keystore file needs to
    // ship with this project.
    buildTypes {
        release {
            // Caution! In production, you need to generate your own keystore
            // file and configure a real release signingConfig here.
            // https://reactnative.dev/docs/signed-apk-android
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

// Autolinking of react-native-vector-icons' bundled font files (Ionicons.ttf
// etc.) into the Android assets — the officially documented Android hookup
// for this package.
apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")

dependencies {
    implementation("com.facebook.react:react-android")
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)
